name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Hash-pinned install (OpenSSF Scorecard Pinned-Dependencies). The
      # package itself installs with --no-deps on top of the pinned tree.
      - name: Install dependencies (hash-pinned)
        run: |
          pip install --require-hashes -r requirements/test.txt
          pip install --no-deps -e .

      - name: Run tests with 100% coverage gate
        run: |
          pytest tests/ \
            --cov=pacs008_loader_mt103 --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100

      - name: Enforce 100% docstring coverage
        run: interrogate -c pyproject.toml pacs008_loader_mt103

      # Not a timing gate -- wall-clock is not comparable between
      # runners. This proves the benchmark still runs against the
      # current API rather than rotting into a file that reads as
      # verified and is not.
      - name: Run the benchmark
        run: python benches/bench_parse_mt103.py --quick

      - name: Run examples end-to-end
        run: |
          for example in examples/*.py; do
            echo "--- $example ---"
            python "$example"
          done

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install lint tools (hash-pinned)
        run: |
          pip install --require-hashes -r requirements/lint.txt
          pip install --no-deps -e .

      - name: Ruff check
        run: ruff check pacs008_loader_mt103/ tests/ examples/ benches/ scripts/ fuzz/

      # The conformance gate requires a formatter to run somewhere.
      # This repository lints with ruff, and ruff's own formatter is the
      # one that needs no new dependency.
      - name: Ruff format check
        run: ruff format --check pacs008_loader_mt103/ tests/ examples/ benches/ scripts/ fuzz/

      - name: Mypy
        run: mypy pacs008_loader_mt103/ scripts/

  # The native advisory audit over every hash-pinned requirements file, so
  # a published advisory against pacs008 or anything it pulls in fails the
  # pull request rather than waiting for a Dependabot alert.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pip-audit (hash-pinned)
        run: pip install --require-hashes -r requirements/audit.txt

      - name: pip-audit
        run: |
          for f in requirements/*.txt; do
            echo "--- $f ---"
            pip-audit --progress-spinner off --require-hashes --disable-pip -r "$f"
          done
